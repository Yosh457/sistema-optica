{% extends "base.html" %}
{% block title %}Crear Producto{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto my-12 bg-white p-8 rounded-xl shadow-lg">
    <div class="border-b pb-4 mb-8">
        <h2 class="text-2xl font-bold text-gray-800">Registrar Nuevo Producto</h2>
        <p class="text-gray-500 text-sm mt-1">El artículo nacerá con stock cero en el Kardex.</p>
    </div>

    <form method="POST" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Nombre del Producto</label>
            <input type="text" name="nombre" value="{{ datos_previos.nombre if datos_previos else '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Ej: Cristal Multifocal Fotocromático 1.56" required>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Categoría</label>
                <select name="categoria_id" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white font-medium" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    {% for cat in categorias %}
                        <option value="{{ cat.id }}" {% if datos_previos and datos_previos.categoria_id == cat.id|string %}selected{% endif %}>{{ cat.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Código de Proveedor (Opcional)</label>
                <input type="text" name="codigo" value="{{ datos_previos.codigo if datos_previos else '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-mono" placeholder="Ej: PRD-001">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Proveedor Principal (Opcional)</label>
                <select name="proveedor_id" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                    <option value="">Sin proveedor asignado</option>
                    {% for prov in proveedores %}
                        <option value="{{ prov.id }}" {% if datos_previos and datos_previos.proveedor_id == prov.id|string %}selected{% endif %}>{{ prov.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Stock Mínimo (Alerta)</label>
                <input type="number" name="stock_minimo" value="{{ datos_previos.stock_minimo if datos_previos else '5' }}" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Precio Compra Inicial (Neto)</label>
                <div class="relative">
                    <span class="absolute left-3 top-2.5 text-gray-500 font-bold">$</span>
                    <input type="number" step="0.01" min="0" name="precio_compra" value="{{ datos_previos.precio_compra if datos_previos else '0' }}" class="w-full pl-8 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
            </div>
            <div>
                <label class="block text-sm font-bold text-blue-700 mb-1">Precio de Venta al Público</label>
                <div class="relative">
                    <span class="absolute left-3 top-2.5 text-blue-600 font-bold">$</span>
                    <input type="number" step="0.01" min="0" name="precio" value="{{ datos_previos.precio if datos_previos else '' }}" class="w-full pl-8 pr-4 py-2 border-2 border-blue-200 bg-blue-50 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-bold text-blue-800" required>
                </div>
            </div>
        </div>

        <div class="flex justify-end gap-4 pt-6 border-t border-gray-100 mt-8">
            <a href="{{ url_for('inventario.listar_productos') }}" class="px-6 py-2 border border-gray-300 text-gray-700 font-semibold rounded-lg hover:bg-gray-50 transition">Cancelar</a>
            <button type="submit" class="px-6 py-2 bg-blue-600 text-white font-bold rounded-lg shadow-md hover:bg-blue-700 transition">Crear Producto</button>
        </div>
    </form>
</div>
{% endblock %}
